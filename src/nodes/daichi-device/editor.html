<script type="text/markdown" data-help-name="daichi-device">
  Monitors and controls one air conditioner in Daichi Comfort Cloud.

  ### Inputs

  : topic (string) : must be `control`; messages with any other topic are ignored
  : payload.functionId (number) : the function to change, for example power or target temperature
  : payload.value (number | boolean) : a number for value functions, a boolean for on/off functions

  ### Outputs

  : topic (string) : always `device-state`
  : payload (object) : the device state, merged from the last full read and the latest cloud update

  The node sends the device state when the flow starts, whenever the cloud
  pushes an update, and after every accepted command.

  > [!TIP]
  > Function ids differ between models. Send `DEBUG=daichi` output or read the
  > `pult` list of the first message to discover the ids of your own device.

  ### References

  - [daichi](https://github.com/niklv/daichi) - the cloud client this node uses
</script>
