<script type="text/markdown" data-help-name="daichi-service">
  Holds the credentials of a [Daichi Comfort Cloud](https://web.daichicloud.ru)
  account and keeps one live connection to it.

  Every **daichi device** node in the flow shares this connection: the account is
  logged in once, and device updates arrive over the cloud's MQTT broker.

  > [!IMPORTANT]
  > Use the e-mail and password of your Daichi account. They are stored in
  > Node-RED's credentials file, not in the flow.
</script>
